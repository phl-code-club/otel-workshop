include:
  - ./collector/docker-compose.yaml
  - ./grafana/docker-compose.yaml
  - ./auth-service/docker-compose.yaml
  - ./profile-service/docker-compose.yaml
services:
  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.148.0
    container_name: telemetrygen
    profiles:
      - "scripts"
    command: --otlp-endpoint "collector"
  trafficgen:
    build:
      context: ./gentraffic
      dockerfile: Dockerfile
    container_name: trafficgen
    profiles:
      - "scripts"
    environment:
      USER_COUNT: ${USER_COUNT:-100}
      AUTH_URL: http://auth-service:8000
      PROFILE_URL: http://profile-service:8080
