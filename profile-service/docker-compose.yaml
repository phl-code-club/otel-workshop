include:
  - ../postgres/docker-compose.yaml

services:
  profile-service:
    container_name: profile-service
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      OTEL_SERVICE_NAME: "profile-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"
      DB_HOST: "postgres"
    depends_on:
      postgres:
        condition: service_healthy
